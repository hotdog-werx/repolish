[settings]
experimental = true
python.uv_venv_auto = true
# Inline task scripts are POSIX ($DK_UVTB_*_EXEC indirection, multi-line
# blocks), but mise runs them with `cmd /c` on Windows, and cmd cannot
# expand $VAR - so the env-var routing works only after this override.
# GitHub's windows runners ship Git Bash, so bash is on PATH there.
windows_default_inline_shell_args = "bash -c -o errexit"

[task_config]
includes = [
  "mise-tasks",
  "mise-tasks/*.toml",
]

[env]
_.file = [
  "mise-tasks/default.env",
]
GITHUB_REPO_OWNER = "hotdog-werx"
GITHUB_REPO_NAME = "{{ config_root | basename }}"
GITHUB_REPO = "{{ env.GITHUB_REPO_OWNER }}/{{ env.GITHUB_REPO_NAME }}"
GIT_CLIFF_CONFIG = "./cliff.toml"

[hooks]
postinstall = ["mise run setup"]

[tools]
uv = "0.9.27"
dprint = "0.57.4"
starship = "1.24.2"
git-cliff = "2.12.0"
actionlint = "1.7.10"
shellcheck = "0.11.0"

"pipx:releez" = "1.1.1"
"pipx:zensical" = "0.0.62"
"pipx:ty" = "0.0.89"

"pipx:uv-toolbox" = "0.4.1"
