name: create-release

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write
  pull-requests: read

jobs:
  github-release:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.releez.outputs.release-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No project environment needed: releez finalizes from its own
      # install, the notes step uses system python, and the changelog
      # regenerates through the pipx releez that mise installs here
      # (same shape as checks-complete-action's create-release).
      - name: mise
        uses: jdx/mise-action@v3

      - name: releez-finalize
        id: releez
        # the unified releez action installs its own uv and uses the
        # pipx-installed releez from mise (both at the same version)
        uses: hotdog-werx/releez@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEEZ_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        with:
          mode: finalize

      - name: enhance-release-notes
        id: enhance-notes
        shell: python
        env:
          NOTES: ${{ steps.releez.outputs.release-notes }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          import os
          notes = os.environ['NOTES']
          pr_number = os.environ['PR_NUMBER']
          repo = os.environ['GITHUB_REPOSITORY']
          pr_link = f'https://github.com/{repo}/pull/{pr_number}'
          enhanced_notes = f'{notes}\n\n---\nAutomated release triggered by [#{pr_number}]({pr_link})'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('enhanced-notes<<EOF\n')
              f.write(enhanced_notes)
              f.write('\nEOF\n')

      - name: create-github-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.releez.outputs.release-version }}
          body: ${{ steps.enhance-notes.outputs.enhanced-notes }}

      - name: regenerate-changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEEZ_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        # releez changelog regenerate does not run the post-changelog hooks
        # (only `release start` does), so dprint the file here to match the
        # formatting the release PR carried.
        run: |
          mise exec -- releez changelog regenerate
          mise exec -- dprint fmt CHANGELOG.md

      - name: commit-changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore(ci): regenerate changelog after release [skip ci]'
          branch: ${{ github.event.pull_request.base.ref }}
          file_pattern: 'CHANGELOG.md'

  build-publish:
    needs: github-release
    runs-on: ubuntu-latest
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup-uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'
      - name: mise
        uses: jdx/mise-action@v3
      - name: dependencies
        run: mise run setup

      - name: expose-version
        run: |
          {
            echo "IS_RELEASE=true"
            echo "VERSION=${{ needs.github-release.outputs.release-version }}"
          } >> "$GITHUB_ENV"

      - name: build-project
        run: mise run build

      - name: publish-package
        run: mise run publish
