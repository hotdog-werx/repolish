name: ci-checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['windows-latest', 'ubuntu-latest', 'macos-latest']
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'
      - name: mise
        uses: jdx/mise-action@v3
      - name: dependencies
        run: mise run setup

      - name: check-dprint
        run: mise run check-dprint
      - name: check-python
        run: mise run check-python
      - name: check-ty
        run: mise run check-ty
      - name: check-complexity
        run: mise run check-complexity
      - name: check-coverage
        run: mise run check-coverage
      - name: build-docs
        run: mise run build-docs
