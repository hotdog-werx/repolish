# Formatters. format-python is a hybrid-width pass in three ruff steps:
# 1. format at line-length 80: forces calls/collections longer than 80 to
#    split, and the split form carries a magic trailing comma.
# 2. COM812 autofix: backstop for the trailing commas (the format pass in
#    step 1 is what adds them).
# 3. format at the configured line length (119): rejoins everything that
#    now fits, but the magic trailing commas keep the >80 constructs
#    exploded.
# Net effect: split decisions are made at 80, lines fill to 119, and the
# final step is plain `ruff format`, so the output always passes the
# format check. It replaces the old codeguide pipeline (80-column wrap,
# add-trailing-comma, 120-column unwrap) with the same algorithm in ruff.
[format-python]
description = "format python code"
usage = '''
arg "[format_target]" var=#true default="." help="Files to format"
'''
run = [
  "{{ env.DK_UVTB_TOOLS_EXEC }} ruff format --config ./ruff.toml --line-length=80 {{ usage.format_target | join(sep=' ') }}",
  "{{ env.DK_UVTB_TOOLS_EXEC }} ruff check --config ./ruff.toml --extend-select COM812 --fix --fix-only {{ usage.format_target | join(sep=' ') }}",
  "{{ env.DK_UVTB_TOOLS_EXEC }} ruff format --config ./ruff.toml {{ usage.format_target | join(sep=' ') }}",
]

[format-dprint]
description = "format dprint-managed files"
run = "dprint fmt"

[format]
description = "run all formatters"
depends = ["format-python", "format-dprint"]
