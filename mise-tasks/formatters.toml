# Formatters. format-python is the ruff pair the repo actually follows:
# autofixes, then a format pass at the configured line length (119). The
# codeguide pipeline this replaces (an 80-column wrap, add-trailing-comma,
# a 120-column unwrap) was never used here — its output diverges from
# plain `ruff format` and would rewrite the whole tree.
[format-python]
description = "format python code"
usage = '''
arg "[format_target]" var=#true default="." help="Files to format"
'''
run = [
  "$DK_UVTB_TOOLS_EXEC ruff format --config ./ruff.toml --line-length=80 ${usage_format_target}",
  "$DK_UVTB_TOOLS_EXEC ruff check --config ./ruff.toml --extend-select COM812 --fix --fix-only ${usage_format_target}",
  "$DK_UVTB_TOOLS_EXEC ruff format --config ./ruff.toml ${usage_format_target}",
]

[format-dprint]
description = "format dprint-managed files"
run = "dprint fmt"

[format]
description = "run all formatters"
depends = ["format-python", "format-dprint"]
