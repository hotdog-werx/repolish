# Python checks. ruff and complexipy run from the uv-toolbox `tools` env;
# ty is a mise-managed tool (0.0.89; older pins emit false positives).
# The DK_UVTB_*_EXEC indirection is rendered by mise templating
# ({{ env.* }}), not shell expansion: inline task runs go through
# `cmd /c` on Windows, where $VAR never expands.
["python:check:types"]
description = "type check with ty"
run = "ty check"

["python:check:complexity"]
description = "complexity gate (fails above 20 on the complexipy 8.x scale)"
run = '{{ env.DK_UVTB_TOOLS_EXEC }} complexipy --max-complexity-allowed {{ env.DK_COMPLEXIPY_THRESHOLD }} .'

["python:check:ruff"]
description = "ruff lint and format check (tools-env 0.17.1)"
run = [
  '{{ env.DK_UVTB_TOOLS_EXEC }} ruff --config ./ruff.toml check .',
  '{{ env.DK_UVTB_TOOLS_EXEC }} ruff --config ./ruff.toml format --check .',
]
