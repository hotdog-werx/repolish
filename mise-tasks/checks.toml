# The CI gate: python checks live in python.toml, drift and formatting
# checks here, plus the full test suite with coverage at 100%.
[check-dprint]
description = "check dprint-managed formatting"
run = "dprint check"

[check-coverage]
description = "run the test suite with coverage (100% required)"
run = "uv run pytest -vv --tb=short --cov-config=./coveragerc.toml --cov=repolish --cov-report=term-missing --cov-report=html:.coverage-files/htmlcov -n auto"

[ci-checks]
description = "run all checks for CI"
depends = [
  "python:check:types",
  "python:check:complexity",
  "python:check:ruff",
  "check-dprint",
  "workspace:repolish:check",
  "check-coverage",
]
