# Documentation tasks (zensical is a mise-managed pipx tool).
[dev-docs]
description = "start the docs development server"
run = "zensical serve --dev-addr=127.0.0.1:8000"

[build-docs]
description = "build the static documentation site"
run = "zensical build --clean"

[clean-docs]
description = "clean docs build artifacts"
run = "rm -rf site/"
